            <option value="" disabled selected>Seleccione un platillo</option>
        </select>
    </div>

    <h6>Nombre</h6>

    <div class="input-field">
        <input
            id="nombre"
            type="text"
            placeholder="Coloque su Nombre"
            class="validate">
    </div>

    <h6>Dirección</h6>

    <div class="input-field">
        <input
            id="Direccion"
            type="text"
            placeholder="Coloque su Dirección"
            class="validate">

    <button
        id="btnGuardarPedido"
        type="button">
        Guardar pedido

    <button
        id="btnCanselar"

        Cancelar
    </button>

        type="button">ubicacion
